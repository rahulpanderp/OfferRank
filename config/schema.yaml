version: "0.1"
dataset_name: "offerrank"

entities:
  users:
    description: "User profile and behavioral aggregates used for personalization."
    primary_key: "user_id"
    columns:
      - name: "user_id"
        dtype: "string"
        required: true
        description: "Unique user identifier."
      - name: "age_band"
        dtype: "string"
        required: true
        description: "Age bucket of the user."
      - name: "income_band"
        dtype: "string"
        required: true
        description: "Income bucket used for eligibility and relevance."
      - name: "credit_score_band"
        dtype: "string"
        required: true
        description: "Credit quality segment."
      - name: "risk_segment"
        dtype: "string"
        required: true
        description: "User risk segment used for offer suitability."
      - name: "life_stage"
        dtype: "string"
        required: true
        description: "Life stage such as student, salaried, family, or retiree."
      - name: "tenure_days"
        dtype: "integer"
        required: true
        description: "Days since user joined the platform."
      - name: "app_opens_30d"
        dtype: "integer"
        required: true
        description: "Number of app opens in the last 30 days."
      - name: "clicks_30d"
        dtype: "integer"
        required: true
        description: "Number of offer clicks in the last 30 days."
      - name: "conversions_90d"
        dtype: "integer"
        required: true
        description: "Number of offer conversions in the last 90 days."

  offers:
    description: "Offer catalog with product and business attributes."
    primary_key: "offer_id"
    columns:
      - name: "offer_id"
        dtype: "string"
        required: true
        description: "Unique offer identifier."
      - name: "offer_type"
        dtype: "string"
        required: true
        description: "Type of offer such as card upgrade, SIP, insurance, cashback, or BNPL."
      - name: "provider_id"
        dtype: "string"
        required: true
        description: "Identifier of the provider or issuer."
      - name: "annual_fee"
        dtype: "float"
        required: false
        description: "Annual fee associated with the offer if applicable."
      - name: "reward_type"
        dtype: "string"
        required: false
        description: "Primary reward mechanism for the offer."
      - name: "expected_margin"
        dtype: "float"
        required: true
        description: "Expected business margin from a successful conversion."
      - name: "risk_cost"
        dtype: "float"
        required: true
        description: "Estimated business or underwriting cost."
      - name: "is_active"
        dtype: "boolean"
        required: true
        description: "Whether the offer is currently active."

  impressions:
    description: "Exposure log capturing what offer was shown to which user in what context."
    primary_key: "impression_id"
    columns:
      - name: "impression_id"
        dtype: "string"
        required: true
        description: "Unique identifier for an impression event."
      - name: "request_id"
        dtype: "string"
        required: true
        description: "Identifier for the ranking request or session event."
      - name: "user_id"
        dtype: "string"
        required: true
        description: "User who received the impression."
      - name: "offer_id"
        dtype: "string"
        required: true
        description: "Offer shown in the impression."
      - name: "event_ts"
        dtype: "timestamp"
        required: true
        description: "Timestamp when the impression occurred."
      - name: "channel"
        dtype: "string"
        required: true
        description: "Serving channel such as app_home, campaign, or notifications."
      - name: "placement"
        dtype: "string"
        required: true
        description: "UI placement where the offer appeared."
      - name: "rank_position"
        dtype: "integer"
        required: true
        description: "Displayed position within the ranked list."
      - name: "policy_name"
        dtype: "string"
        required: true
        description: "Name of the serving policy."
      - name: "policy_version"
        dtype: "string"
        required: true
        description: "Version of the serving policy."
      - name: "score"
        dtype: "float"
        required: true
        description: "Raw ranking score assigned by the policy."
      - name: "propensity"
        dtype: "float"
        required: false
        description: "Probability of selecting this item under the logging policy."

  clicks:
    description: "Short-term engagement events tied back to impressions."
    primary_key: "click_id"
    columns:
      - name: "click_id"
        dtype: "string"
        required: true
        description: "Unique click event identifier."
      - name: "impression_id"
        dtype: "string"
        required: true
        description: "Impression that generated the click."
      - name: "click_ts"
        dtype: "timestamp"
        required: true
        description: "Timestamp when the click happened."

  conversions:
    description: "Delayed business outcomes tied back to impressions."
    primary_key: "conversion_id"
    columns:
      - name: "conversion_id"
        dtype: "string"
        required: true
        description: "Unique conversion event identifier."
      - name: "impression_id"
        dtype: "string"
        required: true
        description: "Impression that led to the conversion."
      - name: "conversion_ts"
        dtype: "timestamp"
        required: true
        description: "Timestamp when the conversion happened."
      - name: "conversion_value"
        dtype: "float"
        required: true
        description: "Business value of the conversion."
      - name: "realized_margin"
        dtype: "float"
        required: true
        description: "Observed business margin after conversion."

relationships:
  - from_entity: "impressions"
    from_column: "user_id"
    to_entity: "users"
    to_column: "user_id"

  - from_entity: "impressions"
    from_column: "offer_id"
    to_entity: "offers"
    to_column: "offer_id"

  - from_entity: "clicks"
    from_column: "impression_id"
    to_entity: "impressions"
    to_column: "impression_id"

  - from_entity: "conversions"
    from_column: "impression_id"
    to_entity: "impressions"
    to_column: "impression_id"